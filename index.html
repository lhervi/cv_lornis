    <!-- Carga de Bootstrap 5 para un diseño rápido y responsivo -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <style>
      /* Variables de Tema: Default (Claro) */
      :root {
        --cv-bg: #ffffff;
        --cv-text: #212529; /* Dark Bootstrap text */
        --cv-primary: #003366; /* Navy Blue */
        --cv-secondary: #495057; /* Dark Grey */
        --cv-accent: #28a745; /* Modern Green */
        --cv-border: #e9ecef;
        --cv-link: #0d6efd;
      }

      /* Variables de Tema: Modo Oscuro */
      body[data-theme="dark"] {
        --cv-bg: #1e1e1e;
        --cv-text: #e0e0e0;
        --cv-primary: #6495ed; /* Cornflower Blue (Contraste) */
        --cv-secondary: #aaaaaa;
        --cv-accent: #90ee90; /* Light Green (Contraste) */
        --cv-border: #333333;
        --cv-link: #87cefa;
        background-color: var(--cv-border) !important;
        color: var(--cv-text);
      }

      /* Estilos generales del CV */
      body {
        background-color: var(--cv-border);
        transition: background-color 0.3s;
        font-family: "Inter", sans-serif;
      }

      .cv-container {
        background-color: var(--cv-bg);
        color: var(--cv-text);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        border-radius: 12px;
        transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        line-height: 1.6;
      }

      /* Cabecera */
      .cv-header {
        border-bottom: 3px solid var(--cv-primary);
      }

      .cv-header h1 {
        color: var(--cv-primary);
        font-weight: 700;
      }

      .cv-header h2 {
        color: var(--cv-secondary);
      }

      /* Botones de control (Modo y Lenguaje) */
      .control-buttons .btn {
        background-color: var(--cv-primary);
        border-color: var(--cv-primary);
        color: white;
        transition: background-color 0.2s, border-color 0.2s;
      }

      .control-buttons .btn:hover {
        background-color: var(--cv-accent);
        border-color: var(--cv-accent);
      }

      /* Secciones */
      .cv-section h3 {
        font-size: 1.3em;
        color: var(--cv-primary);
        border-bottom: 2px solid var(--cv-border);
        padding-bottom: 5px;
        margin-bottom: 15px;
        font-weight: 600;
      }
      body[data-theme="dark"] .cv-section h3 {
        border-bottom-color: var(--cv-secondary);
      }

      /* Experiencia y Educación Timeline */
      .job-entry,
      .education-entry {
        border-left: 4px solid var(--cv-accent);
        padding-left: 15px;
        margin-bottom: 1rem;
        position: relative;
      }

      .job-entry::before,
      .education-entry::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 5px;
        width: 12px;
        height: 12px;
        background-color: var(--cv-primary);
        border-radius: 50%;
      }

      .job-entry h4 {
        color: var(--cv-text);
        font-weight: 600;
      }

      .job-entry ul {
        list-style: none;
        padding-left: 0;
        font-size: 0.95em;
      }

      .job-entry ul li::before {
        content: "▪";
        color: var(--cv-accent);
        display: inline-block;
        width: 1em;
        margin-left: -1em;
        font-weight: bold;
      }

      .skill-category {
        font-weight: bold;
        color: var(--cv-primary);
        display: block;
        margin-bottom: 3px;
      }

      /* Botón de Mostrar Más */
      .show-more-btn {
        display: block;
        width: fit-content;
        margin: 10px 0 0 auto;
        padding: 6px 12px;
        background-color: var(--cv-secondary);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85em;
        transition: background-color 0.2s;
      }

      .show-more-btn:hover {
        background-color: var(--cv-primary);
      }
    </style>
  </head>

      /**
       * Genera el HTML para una sección de Experiencia Laboral.
       * @param {Object} job - Objeto de trabajo.
       * @param {Object} t - Objeto de traducciones.
       * @param {string} lang - Idioma actual.
       * @returns {string} HTML.
       */

        const descriptionHtml = job.description[lang]
          .map((desc) => `<li>${desc}</li>`)
          .join("");
        return `
                <div class="job-entry">
                    <h4 class="fs-5">${job.title}</h4>
                    <p class="text-secondary fst-italic mb-2">${job.duration}</p>
                    <ul class="mb-3">${descriptionHtml}</ul>
                </div>
            `;
      };

      /**
       * Genera el HTML para una sección de Educación.
       * @param {Object} edu - Objeto de educación.
       * @returns {string} HTML.
       */
      const renderEducationEntry = (edu) => {
        return `
                <div class="education-entry">
                    <h4 class="fs-5">${edu.title}</h4>
                    <p class="text-secondary">${edu.institution} - ${edu.year}</p>
                </div>
            `;
      };

       * Función principal que renderiza todo el contenido del CV.
       */

        const cvContent = document.getElementById("cv-content");

        const visibleExperience = showAllExperience
          ? cvData.experience
          : cvData.experience.slice(0, 3);

        // Lógica de filtrado de Certificaciones (Mostrar solo los 3 años más recientes)
        const certificationYears = Object.keys(cvData.certifications).sort(
          (a, b) => b - a
        );
        const visibleCertificationYears = showAllCertifications
          ? certificationYears
          : certificationYears.slice(0, 3);

        // Mapeo de idiomas para traducción
        const languageData = cvData.languages.map((item) => ({
          lang:
            currentLang === "es"
              ? item.lang
              : item.lang === "Nativo"
              ? t.native
              : t.english,
          proficiency: item.proficiency,

                          ).value

                        <span>📞 ${

                            (c) => c.type === "phone1"
                          ).value
                        }</span>

                              ).value
                            }" target="_blank" rel="noopener noreferrer">GitHub</a>
                        </span>
                        <span>📍 ${
                          cvData.personalInfo.contact.find(
                            (c) => c.type === "location"
                          ).value

                </section>

                <section class="cv-section">
                    <h3>${t.experience}</h3>
                    <div id="experience-list">
                        ${visibleExperience
                          .map((job) => renderJobEntry(job, t, currentLang))
                          .join("")}

                      cvData.experience.length > 3

                      .map((edu) => renderEducationEntry(edu))
                      .join("")}

                <!-- Habilidades Técnicas -->

                        }:</span> ${cvData.skills.frameworks}</div>
                        <div class="col"><span class="skill-category">Web:</span> ${

                                ${cvData.interests[currentLang]

                                    (interest) =>

                                  )
                                  .join("")}
                            </ul>
                        </div>
                    </div>
                </section>
            `;

        cvContent.innerHTML = html;

        // Actualizar iconos de botones
        document.getElementById("mode-toggle").innerHTML =
          t.modeIcon(isDarkMode);
        document.getElementById("lang-toggle").innerHTML = t.langButton;
      };

      // --- MANEJADORES DE EVENTOS ---

      /**
       * Cambia entre el modo claro y oscuro.
       */
      const toggleDarkMode = () => {
        isDarkMode = !isDarkMode;
        document.body.setAttribute("data-theme", isDarkMode ? "dark" : "light");
        renderCV(); // Re-renderiza para actualizar el icono del botón
      };

      /**
       * Cambia entre español e inglés.
       */
      const toggleLanguage = () => {
        currentLang = currentLang === "es" ? "en" : "es";
        document.documentElement.lang = currentLang;
        renderCV();
      };

      /**
       * Muestra/oculta toda la experiencia laboral.
       */
      const toggleExperience = () => {
        showAllExperience = !showAllExperience;
        renderCV();
      };

      /**
       * Muestra/oculta todas las certificaciones.
       */
      const toggleCertifications = () => {
        showAllCertifications = !showAllCertifications;
        renderCV();
      };

      // --- INICIALIZACIÓN ---
      window.onload = () => {
        document
          .getElementById("mode-toggle")
          .addEventListener("click", toggleDarkMode);
        document
          .getElementById("lang-toggle")
          .addEventListener("click", toggleLanguage);

        // Renderizado inicial
        renderCV();
      };
